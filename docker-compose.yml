services:
  postgres:
    image: postgres:17-alpine
    container_name: routine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: routine
      POSTGRES_PASSWORD: routine
      POSTGRES_DB: routine
    ports:
      # 5432 часто зайнятий іншими проєктами
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U routine -d routine']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: routine-pgdata
